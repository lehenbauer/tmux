# Minimal-disturbance pane closure for whisp.
#
# With remain-on-exit on, a dying pane process changes NO layout: the dead
# pane holds its place while tmux fires the pane-died hook, and the planner
# (scripts/whisp-pane-planner.py) performs the close. Panes spanning the
# window's full height/width shrink the window; interior panes are absorbed
# along one edge; every other pane keeps its exact size whenever geometry
# allows. Zoomed windows and windows with floating panes fall back to a
# plain kill-pane.
#
# The socket is passed via #{socket_path}, expanded when the hook fires, so
# this file works on any server. Failures are visible by design: if the hook
# ever breaks, the dead pane stays on screen instead of misbehaving silently
# (see /tmp/whisp-pane-close-hook.log).
#
# Apply:   tmux source-file /Users/karl/src/tmux/scripts/whisp-pane-close-hook.conf
# Revert:  tmux set -g remain-on-exit off \; set-hook -gu pane-died

set -g remain-on-exit on
set-hook -g pane-died 'run-shell -b "python3 /Users/karl/src/tmux/scripts/whisp-pane-planner.py -S #{socket_path} close -t #{pane_id} >>/tmp/whisp-pane-close-hook.log 2>&1"'
